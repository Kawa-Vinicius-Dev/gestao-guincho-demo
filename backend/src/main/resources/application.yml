spring:
  application:
    name: fluxo-gestao-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fluxo_gestao}
    username: ${DATABASE_USERNAME:fluxo}
    password: ${DATABASE_PASSWORD:fluxo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/postgresql
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage-dir: ${STORAGE_DIR:./storage/importacoes}
  session-hours: ${SESSION_HOURS:12}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}

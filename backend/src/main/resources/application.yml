spring:
  application:
    name: fluxo-gestao-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fluxo_gestao}
    username: ${DATABASE_USERNAME:fluxo}
    password: ${DATABASE_PASSWORD:fluxo}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/postgresql

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage-dir: ${STORAGE_DIR:./storage/importacoes}
  session-hours: ${SESSION_HOURS:12}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  storage:
    supabase:
      url: ${SUPABASE_STORAGE_URL:}
      service-role-key: ${SUPABASE_STORAGE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:comprovantes}

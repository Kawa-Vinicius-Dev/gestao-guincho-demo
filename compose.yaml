services:
  postgres:
    image: postgres:17-alpine
    container_name: fluxo-gestao-postgres
    environment:
      POSTGRES_DB: fluxo_gestao
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo
    ports:
      - "5432:5432"
    volumes:
      - fluxo_gestao_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo -d fluxo_gestao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fluxo_gestao_postgres:

